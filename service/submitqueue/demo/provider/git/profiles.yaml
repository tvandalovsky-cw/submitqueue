# Extension profiles for the "git" example: a plain git remote with no provider.
#
# There is no provider to ask about a change, and no CI to run, so both edge
# integrations stay fake. What this example exercises is the merge itself — see
# merge.yaml.

defaults:
  # A local git remote has no API to fetch change metadata from; the fake
  # echoes back each URI it is given.
  changeProvider: {type: fake}
  # Every build succeeds immediately, so a land completes in seconds.
  buildRunner: {type: fake}
  # Serialize conservatively unless a queue says otherwise.
  analyzer: {type: all}
  # Same example factors as ../fake/profiles.yaml — see that file for why they
  # are written out rather than left at the neutral default of 1.
  scorer:
    type: evidence
    factors:
      pathPassed: 10
      pathFailed: 0.3
      landing: 12
      cancelling: 0.1
    base:
      type: heuristic

queues:
  # The queue `make demo-requests` and `make land` use by default. Serializes
  # batches that touch a shared directory, matching the github mode.
  #
  # Both halves are real here. The change provider keeps its own copy of the
  # same bare repository Runway merges into and reads each change out of it, so
  # the analyzer keys on paths that were actually committed — including for a
  # change submitted by hand, which nothing else could have described.
  - name: demo-queue
    changeProvider:
      type: git
      git:
        # The orchestrator's own copy, and its own remote pointing at the
        # sandbox — mounted read-only, since it only ever fetches. Runway
        # configures the same repository separately for itself in merge.yaml.
        remoteUrl: file:///srv/git/sandbox.git
        target: main
        repoPath: /var/submitqueue/changerepos/demo
    analyzer: {type: pathoverlap, by: directory}
    # Prices each batch with a System One decision model behind a LiteLLM
    # proxy, read from LITE_URL and LITE_KEY. Without them every batch takes
    # the fallback, the same flat price the defaults give, so the queue behaves
    # exactly as it does without this block. The CoreWeave proxy serves the
    # TypeSafe pass-through rather than LiteLLM's model-routed /v1/systemone.
    #
    # diff sends each change's code with its file list — without it the model
    # sees only line counts — plus touched files in full and related lines
    # from elsewhere in the tree. It reads the change provider's own copy (same
    # repoPath), so the two share one clone and its lock.
    scorer:
      base:
        type: jev
        jev:
          model: jev
          path: /typesafe/v1/systemone
          timeout: 5s
          diff:
            git:
              remoteUrl: file:///srv/git/sandbox.git
              target: main
              repoPath: /var/submitqueue/changerepos/demo
            files: true
            references: true
        fallback: {type: heuristic}

  - name: e2e-git-queue
    # Its own copy, separate from demo-queue's: the two agree about the
    # repository but not about everything else, and a shared path would make
    # whichever was built first decide for both.
    changeProvider:
      type: git
      git:
        remoteUrl: file:///srv/git/sandbox.git
        target: main
        repoPath: /var/submitqueue/changerepos/sandbox
    # Maximum parallelism: batches never conflict, so the test controls
    # ordering through what it lands rather than through the analyzer.
    analyzer: {type: none}
